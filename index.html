<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenELIS Dynamic Report Engine</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f4f6f8;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: #1a1a2e;
            color: #fff;
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: #3a86ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* Card */
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 10px;
        }

        /* Form elements */
        select,
        input[type="date"],
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            color: #1a1a2e;
            background: #fff;
            outline: none;
            transition: border-color 0.15s;
        }

        select:focus,
        input:focus {
            border-color: #3a86ff;
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.1);
        }

        .report-meta {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .report-desc {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
        }

        /* Badges */
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 5px;
        }

        .badge-blue {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-green {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-amber {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-gray {
            background: #f3f4f6;
            color: #374151;
        }

        /* Filters */
        .filters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }

        @media (max-width: 520px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 5px;
        }

        .fixed-notice {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 7px;
            padding: 9px 12px;
            font-size: 12px;
            color: #78350f;
            margin-bottom: 12px;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .fixed-notice strong {
            font-weight: 600;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        button {
            padding: 8px 16px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #d1d5db;
            background: #fff;
            color: #1a1a2e;
            transition: background 0.12s, border-color 0.12s;
        }

        button:hover {
            background: #f9fafb;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #1a1a2e;
            color: #fff;
            border-color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #2d2d4e;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Error */
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 7px;
            padding: 9px 12px;
            font-size: 13px;
            margin-top: 10px;
        }

        /* Results */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-header h2 {
            font-size: 14px;
            font-weight: 600;
        }

        .row-count {
            font-size: 12px;
            background: #f3f4f6;
            color: #374151;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f9fafb;
        }

        th {
            text-align: left;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td {
            padding: 9px 12px;
            border-bottom: 1px solid #f3f4f6;
            color: #1a1a2e;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem;
            color: #9ca3af;
            font-size: 13px;
        }

        .loading-state {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e5e7eb;
            border-top-color: #3a86ff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <div class="header"><a href="admin.html" style="
  font-size: 12px;
  color: #9ca3af;
  text-decoration: none;
  border: 1px solid #374151;
  padding: 5px 12px;
  border-radius: 6px;
">
                &#9998; Admin — Create Report
            </a>

            <div class="header-icon">&#9881;</div>
            <div>
                <h1>OpenELIS Dynamic Report Engine</h1>
                <p>Metadata-driven reporting — reports are database records, not Java classes</p>
            </div>
        </div>

        <!-- Report selector -->
        <div class="card">
            <div class="card-title">Select report</div>
            <select id="report-select" onchange="onReportChange()">
                <option value="">Loading reports...</option>
            </select>
            <div id="report-meta"></div>
        </div>

        <!-- Filters -->
        <div class="card" id="filters-card" style="display:none">
            <div class="card-title">Filters</div>
            <div id="fixed-notice" style="display:none" class="fixed-notice">
                <span>&#128274;</span>
                <span><strong>Fixed filters (hidden from end users):</strong> <span id="fixed-desc"></span></span>
            </div>
            <div id="filters-container"></div>
            <div class="actions">
                <button class="btn-primary" id="run-btn" onclick="runPreview()">Run report</button>
                <button class="download-btn" onclick="downloadCsv()">&#8595; Download CSV</button>
            </div>
            <div id="error-area"></div>
        </div>

        <!-- Results -->
        <div class="card" id="results-card" style="display:none">
            <div class="result-header">
                <h2 id="result-title">Results</h2>
                <span class="row-count" id="row-count">0 rows</span>
            </div>
            <div class="table-wrap" id="results-table"></div>
        </div>

    </div>

    <script>
        const API = 'http://localhost:8080/api';
        let reports = [];
        let currentFilters = [];
        let currentReportId = null;

        async function loadReports() {
            try {
                const res = await fetch(`${API}/reports`);
                reports = await res.json();
                const sel = document.getElementById('report-select');
                sel.innerHTML = '<option value="">— choose a report —</option>' +
                    reports.map(r =>
                        `<option value="${r.id}">${r.name}</option>`
                    ).join('');
            } catch (e) {
                document.getElementById('report-select').innerHTML =
                    '<option>Cannot reach backend — is Spring Boot running on port 8080?</option>';
            }
        }

        async function onReportChange() {
            const sel = document.getElementById('report-select');
            currentReportId = sel.value;

            document.getElementById('results-card').style.display = 'none';
            document.getElementById('error-area').innerHTML = '';

            if (!currentReportId) {
                document.getElementById('filters-card').style.display = 'none';
                document.getElementById('report-meta').innerHTML = '';
                return;
            }

            const report = reports.find(r => r.id == currentReportId);

            document.getElementById('report-meta').innerHTML = `
    <div class="report-meta">
      <span class="badge badge-blue">${report.reportType}</span>
      <span class="badge badge-gray">${report.dataset}</span>
    </div>
    <div class="report-desc">${report.description}</div>
  `;

            // Load PROMPT_USER filters
            const res = await fetch(`${API}/reports/${currentReportId}/filters`);
            currentFilters = await res.json();

            renderFilters(currentFilters);
            await loadFixedFilterInfo(currentReportId);

            document.getElementById('filters-card').style.display = 'block';
        }

        async function loadFixedFilterInfo(reportId) {
            // We call /filters/all if it exists, otherwise skip
            // For now show notice based on known reports
            const knownFixed = {
                2: 'test.description = "HIV Viral Load"'
            };
            const notice = document.getElementById('fixed-notice');
            const desc = document.getElementById('fixed-desc');
            if (knownFixed[reportId]) {
                desc.textContent = knownFixed[reportId];
                notice.style.display = 'flex';
            } else {
                notice.style.display = 'none';
            }
        }

        function renderFilters(filters) {
            const container = document.getElementById('filters-container');
            if (!filters.length) {
                container.innerHTML = '<p style="font-size:13px;color:#6b7280;margin-top:4px">No user-facing filters for this report.</p>';
                return;
            }

            container.innerHTML = '<div class="filters-grid">' +
                filters.map(f => {
                    if (f.operator === 'BETWEEN' && f.dataType === 'DATE') {
                        return `
          <div class="filter-group">
            <label>${f.label} &nbsp;<span class="badge badge-green">from</span></label>
            <input type="date" id="f_${f.fieldPath}_from" value="2024-01-01">
          </div>
          <div class="filter-group">
            <label>${f.label} &nbsp;<span class="badge badge-green">to</span></label>
            <input type="date" id="f_${f.fieldPath}_to" value="2024-12-31">
          </div>
        `;
                    }
                    return `
        <div class="filter-group">
          <label>${f.label}</label>
          <input type="text" id="f_${f.fieldPath}" placeholder="Enter value">
        </div>
      `;
                }).join('') +
                '</div>';
        }

        function collectFilters() {
            const values = {};
            for (const f of currentFilters) {
                if (f.operator === 'BETWEEN') {
                    const from = document.getElementById(`f_${f.fieldPath}_from`)?.value;
                    const to = document.getElementById(`f_${f.fieldPath}_to`)?.value;
                    if (from && to) values[f.fieldPath] = [from, to];
                } else {
                    const val = document.getElementById(`f_${f.fieldPath}`)?.value;
                    if (val) values[f.fieldPath] = [val];
                }
            }
            return values;
        }

        async function runPreview() {
            document.getElementById('error-area').innerHTML = '';
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Running...';

            const resultsCard = document.getElementById('results-card');
            resultsCard.style.display = 'block';
            document.getElementById('results-table').innerHTML =
                '<div class="loading-state"><span class="spinner"></span> Building query...</div>';

            try {
                const res = await fetch(`${API}/reports/preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reportId: parseInt(currentReportId),
                        filters: collectFilters()
                    })
                });
                const data = await res.json();

                if (data.error) {
                    document.getElementById('error-area').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    resultsCard.style.display = 'none';
                    return;
                }

                const report = reports.find(r => r.id == currentReportId);
                document.getElementById('result-title').textContent = report.name;
                document.getElementById('row-count').textContent =
                    `${data.count} row${data.count !== 1 ? 's' : ''}`;

                if (!data.rows.length) {
                    document.getElementById('results-table').innerHTML =
                        '<div class="empty-state">No results found for the selected filters.</div>';
                    return;
                }

                const thead = `<thead><tr>${data.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
                const tbody = `<tbody>${data.rows.map(row =>
                    `<tr>${data.fieldPaths.map(fp => `<td>${row[fp] ?? ''}</td>`).join('')}</tr>`
                ).join('')}</tbody>`;

                document.getElementById('results-table').innerHTML =
                    `<table>${thead}${tbody}</table>`;

            } catch (e) {
                document.getElementById('error-area').innerHTML =
                    `<div class="error">Could not reach backend. Is Spring Boot running on port 8080?</div>`;
                resultsCard.style.display = 'none';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Run report';
            }
        }

        async function downloadCsv() {
            try {
                const res = await fetch(`${API}/reports/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reportId: parseInt(currentReportId),
                        filters: collectFilters()
                    })
                });
                if (!res.ok) { const e = await res.json(); alert(e.error); return; }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `report-${currentReportId}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Download failed. Is Spring Boot running on port 8080?');
            }
        }

        loadReports();
    </script>
</body>

</html>
